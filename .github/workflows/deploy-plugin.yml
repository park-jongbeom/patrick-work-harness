name: Deploy Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          jq empty plugin.json
          echo "plugin.json 유효"

      - name: Validate marketplace.json
        run: |
          jq empty .claude-plugin/marketplace.json
          echo "marketplace.json 유효"

      - name: Validate .claude-plugin/plugin.json
        run: |
          jq empty .claude-plugin/plugin.json
          echo ".claude-plugin/plugin.json 유효"

      - name: Check required fields in plugin.json
        run: |
          jq -e '.name and .version and .description and .keywords and .repository' plugin.json > /dev/null
          echo "plugin.json 필수 필드 확인 완료"

      - name: Check version consistency (plugin.json / .claude-plugin/plugin.json / marketplace.json)
        run: |
          ROOT_VERSION=$(jq -r '.version' plugin.json)
          SPEC_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKET_VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          echo "root=$ROOT_VERSION spec=$SPEC_VERSION marketplace=$MARKET_VERSION"
          if [ "$ROOT_VERSION" != "$SPEC_VERSION" ] || [ "$ROOT_VERSION" != "$MARKET_VERSION" ]; then
            echo "::error::버전 불일치 — plugin.json=$ROOT_VERSION, .claude-plugin/plugin.json=$SPEC_VERSION, marketplace.json=$MARKET_VERSION"
            exit 1
          fi
          echo "3파일 버전 일치 확인 완료 ($ROOT_VERSION)"

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            plugin.json
            .claude-plugin/marketplace.json
